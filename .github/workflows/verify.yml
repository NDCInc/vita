name: Verify Vita

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VITA_URL: http://127.0.0.1:4393/
      VITA_QA_PYTHON: python
      VITA_SUITE: smoke
      VITA_BROWSERS: chromium
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            voice-service/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build and test
        run: |
          npm ci --ignore-scripts
          npm run build
          node qa/model.mjs
          node qa/supporting-model.mjs
          node qa/evidence.mjs
          npm --prefix voice-service ci --ignore-scripts
          node --test voice-service/handler.test.mjs
      - name: Verify browser import and export
        run: |
          python -m pip install 'PyMuPDF==1.26.5'
          npm install --no-save --package-lock=false --ignore-scripts 'playwright@1.65.1'
          npx playwright install --with-deps chromium
          node qa/stage-server.cjs &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --show-error --retry 8 --retry-connrefused "$VITA_URL" > /dev/null
          node qa/suite.cjs
